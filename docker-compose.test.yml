# Disposable integration-test database.  Its data directory is a tmpfs, so
# `docker compose -p e4e-roster-cleanup-test -f docker-compose.test.yml down`
# leaves no roster data behind.  Do not use this file for production.
services:
  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_DB: e4e_roster_test
      POSTGRES_USER: e4e_test
      POSTGRES_PASSWORD: e4e_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e4e_test -d e4e_roster_test"]
      interval: 2s
      timeout: 3s
      retries: 20
