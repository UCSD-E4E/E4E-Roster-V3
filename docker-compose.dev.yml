services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    volumes:
      - ./backend/src:/app/src                 # hot reload on source changes
      - ./backend/views:/app/views             # hot reload on template changes
      - ./frontend/static:/app/public          # live static assets
      - ./backend/certs:/app/certs             # CA certs for LDAP/TLS (gitignored)
      - backend_node_modules:/app/node_modules # isolate container's node_modules
    environment:
      NODE_ENV: dev

  # Optional local webhook forwarding. Slack Socket Mode needs no forwarding.
  smee:
    image: node:20-alpine
    profiles: [webhook-debug]
    env_file: .env
    command: >
      sh -c "npm install -g smee-client &&
             smee --url $$SMEE_URL --target http://backend:3000/webhooks/github/$$GITHUB_WEBHOOK_ORG_ID"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_node_modules:
