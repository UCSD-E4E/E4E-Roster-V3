display_information:
  name: Roster Sandbox
  description: Organization-scoped roster help and access management.
features:
  bot_user:
    display_name: Roster Sandbox
    always_online: false
  slash_commands:
    - command: /roster-connect
      description: Connect your Slack account to the roster
      should_escape: false
    - command: /roster-check
      description: Check your roster account in this workspace
      should_escape: false
    - command: /roster-extend
      description: Renew your shared roster account through 90 days from today
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - im:write
      - users:read
      - users:read.email
      - channels:read
      - channels:join
      - channels:manage
      - groups:read
      - groups:write
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
